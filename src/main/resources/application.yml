server:
  port: ${PORT:8000}

spring:
  application:
    name: aegis-self-healing-engine

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aegis_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration

aegis:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000}
  browser:
    headless: ${BROWSER_HEADLESS:true}
    slow-mo-ms: ${BROWSER_SLOW_MO:100}
    action-timeout-ms: ${BROWSER_ACTION_TIMEOUT:5000}
    navigation-timeout-ms: ${BROWSER_NAV_TIMEOUT:10000}
    channel: ${BROWSER_CHANNEL:chromium} # chromium, chrome, msedge
  ai:
    provider: ${AI_PROVIDER:none} # none, openai, gemini, anthropic
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  healing:
    max-attempts-per-step: ${MAX_HEALING_PER_STEP:3}
    max-total-attempts: ${MAX_TOTAL_HEALING:5}
    confidence-threshold-high: ${CONFIDENCE_HIGH:0.85}
    confidence-threshold-medium: ${CONFIDENCE_MEDIUM:0.60}
  demo:
    target-url: ${DEMO_TARGET_URL:http://localhost:5173}
    internal-url: http://localhost:8000/demo/index.html
  artifacts:
    storage-path: ${ARTIFACTS_DIR:./artifacts}

logging:
  level:
    root: INFO
    com.aegistest: INFO
