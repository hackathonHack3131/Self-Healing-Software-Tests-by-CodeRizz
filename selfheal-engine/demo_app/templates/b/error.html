{% extends "base.html" %}

{% block title %}Payment Error - Version {{ version|upper }}{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 3rem 1.5rem;">
  <div class="alert-error" role="alert">
    Payment service unavailable. Please try again later.
  </div>

  <p style="margin: 1.5rem 0; color: var(--text-muted);">
    An unexpected error occurred while communicating with the payment gateway.
  </p>

  <a href="/v/{{ version }}/payment" class="btn" style="display: inline-block; width: auto; padding: 0.75rem 2rem;">
    Return to Payment
  </a>
</div>
{% endblock %}
